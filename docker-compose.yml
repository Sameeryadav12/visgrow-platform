services:
  postgres:
    image: postgres:16-alpine
    container_name: visgrow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: visgrow
      POSTGRES_PASSWORD: visgrow_local_dev
      POSTGRES_DB: visgrow
    ports:
      - "5433:5432"
    volumes:
      - visgrow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visgrow -d visgrow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  visgrow-pgdata:
